name: verificacoes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verificacoes:
    name: verificacoes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout (histórico completo, para o gitleaks)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar gitleaks (versão e checksum fixados)
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
          rm gitleaks.tar.gz

      - name: gitleaks (histórico completo)
        run: gitleaks git --redact --no-banner --verbose .

      - name: verificar-referencias (uma vez por artefato)
        run: |
          set -u
          falhas=0
          for d in artefatos/*/; do
            [ -d "$d" ] || continue
            echo "== $d"
            bash scripts/verificar-referencias.sh "$d" || falhas=$((falhas + 1))
          done
          [ "$falhas" -eq 0 ]
